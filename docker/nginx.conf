# Nginx reverse proxy for Smart Digital Khata
# - Default server blocks for HTTP (port 80) and HTTPS (port 443)
# - Uncomment & replace yourdomain.com with your actual domain after running setup-ssl.sh
# - Certs are expected under /etc/nginx/certs/<domain>/{fullchain.pem,privkey.pem}

server {
    listen 80 default_server;
    server_name _;

    # Certbot challenge (HTTP-01)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # API
    location /api/ {
        proxy_pass http://backend:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 5m;
    }

    # Admin dashboard
    location / {
        proxy_pass http://admin:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

