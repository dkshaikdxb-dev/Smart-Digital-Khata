name: Import regional translations

# Manual only. Loads the committed regional translation seed
# (backend/src/data/regional-i18n.json) into `i18n_overrides` on the VPS. This
# is REAL localisation data (native ta/te/kn/ml/ur UI strings), not demo data,
# so NO FORCE_DEMO is needed. The importer is idempotent (UPSERT by lang+key)
# and only ever writes the rows in the seed — it never deletes a native
# speaker's later corrections for keys not in the file.
on:
  workflow_dispatch:

concurrency:
  group: import-i18n-${{ github.ref }}
  cancel-in-progress: false

jobs:
  import:
    name: Import regional translations on the VPS
    runs-on: ubuntu-latest
    steps:
      - name: Import over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 10m
          script: |
            set -euo pipefail
            cd "${{ secrets.VPS_PATH || '/opt/Smart-Digital-Khata' }}"
            docker compose exec -T backend npm run import:i18n
