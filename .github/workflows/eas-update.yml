name: EAS Update (OTA)

# One-click over-the-air (OTA) update for the two app flavors — Shop Owner and
# Consumer. Ships JS-shell changes (a new WebView entry, a tweaked native screen,
# a bug fix) to already-installed apps WITHOUT a rebuild. Installed apps pick the
# update up on their next launch.
#
# IMPORTANT — this is only for JS/asset changes that are compatible with the
# installed native runtime. Anything native (a new permission, a new native
# dependency, an SDK bump) needs a fresh build via `eas-build.yml`, NOT an OTA
# update. `runtimeVersion` (sdkVersion policy in app.config.js) gates
# compatibility, so an incompatible update simply won't be served — it won't
# brick an install — but it also won't reach users, so use `eas-build.yml` for
# native changes.
#
# The `--branch` input must match the channel the installed build was made with
# (eas.json): the `*-preview` profiles use channel `preview`, the
# `*-production` profiles use channel `production`. Update the branch whose
# channel the target installs are on (the sideloaded test APKs are `preview`).
#
# Prerequisites are the SAME as eas-build.yml (see mobile-app/EAS_BUILD.md):
#   1. Expo access token in the Actions secret EXPO_TOKEN.
#   2. Per-flavor project id in the Actions variables EAS_PROJECT_ID_OWNER /
#      EAS_PROJECT_ID_CONSUMER (printed by the first build; also created here if
#      missing). This also fills the expo-updates URL (https://u.expo.dev/<id>).
#   3. Each flavor's project has had `eas update:configure` run once (documented
#      in EAS_BUILD.md) — otherwise the first `eas update` here configures it.

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: Which app to update
        type: choice
        options: [consumer, owner]
        default: consumer
      branch:
        description: Update channel/branch (match the installed build's channel)
        type: choice
        options: [preview, production]
        default: preview
      message:
        description: Update message (shown in the Expo dashboard)
        type: string
        default: JS-shell OTA update

jobs:
  ota-update:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      APP_FLAVOR: ${{ inputs.flavor }}
      # Owner and consumer are separate EAS projects (different slugs), so each
      # has its own project id — and its own expo-updates URL. Pick the right one.
      EAS_PROJECT_ID: ${{ inputs.flavor == 'owner' && vars.EAS_PROJECT_ID_OWNER || vars.EAS_PROJECT_ID_CONSUMER }}
    steps:
      - name: Guard — token must be configured
        run: |
          if [ -z "${EXPO_TOKEN}" ]; then
            echo "::error::EXPO_TOKEN secret is not set. Create an Expo access token at https://expo.dev/settings/access-tokens and add it as an Actions secret named EXPO_TOKEN."
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install eas-cli
        run: npm i -g eas-cli

      - name: Verify Expo auth
        run: eas whoami

      - name: Install app dependencies
        working-directory: mobile-app
        run: npm ci

      - name: Resolve or create the EAS project id
        working-directory: mobile-app
        run: |
          set -o pipefail
          VARNAME="EAS_PROJECT_ID_$(echo "${APP_FLAVOR}" | tr '[:lower:]' '[:upper:]')"
          if [ -n "${EAS_PROJECT_ID}" ]; then
            echo "Using ${VARNAME}=${EAS_PROJECT_ID}"
            exit 0
          fi
          # eas.json already carries the id, per build profile, in the env block the
          # EAS worker reads — and that is the id the INSTALLED app was built
          # against, so it is the one an update has to be published to. Prefer it
          # over `eas init --force`, which can CREATE a new project when the slug
          # does not resolve; an update published to a project no installed app
          # points at reaches nobody, silently and with no error. Verified: this
          # yields the same two ids the 2026-09-17 release published to.
          pid=$(node -e "
            const j=require('./eas.json');
            const want=process.env.APP_FLAVOR;
            const ids=new Set();
            for (const p of Object.values(j.build||{})) {
              const e=p.env||{};
              if (e.APP_FLAVOR===want && e.EAS_PROJECT_ID) ids.add(e.EAS_PROJECT_ID);
            }
            if (ids.size===1) process.stdout.write([...ids][0]);
            else if (ids.size>1) console.error('eas.json disagrees with itself for '+want+': '+[...ids].join(', '));
          " 2>&1) || pid=""
          case "$pid" in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]-*)
              echo "EAS_PROJECT_ID=$pid" >> "$GITHUB_ENV"
              echo "Using the '${APP_FLAVOR}' project id from eas.json: $pid"
              exit 0 ;;
            *)
              [ -n "$pid" ] && echo "::warning::could not take the id from eas.json — $pid" ;;
          esac
          echo "No ${VARNAME} variable and no usable id in eas.json — creating/linking the '${APP_FLAVOR}' project on the account from app.config.js (owner field)."
          out=$(eas init --non-interactive --force 2>&1 | tee /dev/stderr) || true
          pid=$(printf '%s\n' "$out" | grep -oiE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | head -1)
          if [ -z "$pid" ]; then
            echo "::error::Could not determine the EAS project id from 'eas init'. See the log above; then create it once and add its id as the Actions variable ${VARNAME}."
            exit 1
          fi
          echo "EAS_PROJECT_ID=$pid" >> "$GITHUB_ENV"
          echo "::notice title=Save this::Project id for '${APP_FLAVOR}' is $pid. Add it as an Actions *variable* named ${VARNAME} to skip this step on future runs."

      - name: Publish OTA update (${{ inputs.flavor }} → ${{ inputs.branch }})
        working-directory: mobile-app
        run: |
          echo "Publishing an OTA update for the ${APP_FLAVOR} app to branch '${{ inputs.branch }}'. Installed apps on that channel pick it up on next launch."
          eas update --branch "${{ inputs.branch }}" --message "${{ inputs.message }}" --non-interactive
          echo "Done. The update group + its branch/channel appear above (also on https://expo.dev under this project's Updates)."

      # An update can publish perfectly and still never reach a phone. The app
      # asks for its CHANNEL (baked into the build from eas.json); `eas update`
      # publishes to a BRANCH. If the channel is not pointed at that branch, the
      # update exists and is served to nobody, silently and with no error.
      #
      # This step makes that visible instead of leaving it to be inferred from
      # an app that will not change. It never fails the job: it is a diagnosis,
      # and a missing channel is exactly what we want it to be able to report.
      - name: Diagnose delivery (channel → branch, runtime version)
        if: always()
        working-directory: mobile-app
        continue-on-error: true
        run: |
          echo "--- channels (what an installed build asks for) ---"
          eas channel:list --non-interactive || echo "could not list channels"
          echo
          echo "--- channel '${{ inputs.branch }}' in detail: which branch does it serve? ---"
          eas channel:view "${{ inputs.branch }}" --non-interactive || echo "NO CHANNEL NAMED '${{ inputs.branch }}' — an installed build on that channel is served nothing."
          echo
          echo "--- branch '${{ inputs.branch }}': what has been published to it? ---"
          eas branch:view "${{ inputs.branch }}" --non-interactive || echo "could not view branch"
          echo
          echo "--- the runtime version this update was built for ---"
          echo "runtimeVersion policy: sdkVersion (an installed APK only accepts updates whose runtime matches its own)"
          echo
          echo "--- can the INSTALLED APP even ask for this update? ---"
          # This used to evaluate app.config.js right here and print a URL, which
          # was worse than printing nothing: EAS_PROJECT_ID is set on THIS runner,
          # so it always resolved and always looked healthy — while the app that
          # matters was built on the EAS worker, where the variable was absent and
          # the URL came out undefined. The check confirmed the publisher's
          # environment and told us nothing about the phone's.
          #
          # What actually decides it is the build profile's `env` block, because
          # that is the only environment the worker sees.
          node -e "
            const j=require('./eas.json');
            let bad=0;
            for (const [name,p] of Object.entries(j.build||{})) {
              const id=(p.env||{}).EAS_PROJECT_ID;
              console.log('  ' + name.padEnd(20) + (id ? 'EAS_PROJECT_ID present -> app will have an updates URL' : 'NO EAS_PROJECT_ID -> an app built on this profile can NEVER update'));
              if(!id) bad++;
            }
            if (bad) { console.log(''); console.log('::warning::' + bad + ' build profile(s) would produce an app with no updates URL.'); }
          " || true
