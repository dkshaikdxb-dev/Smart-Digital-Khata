name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      seed_demo:
        description: >-
          Also load the ten demo shops, their catalogues and the house promos.
          This writes fictional shops, owners, customers and MONEY ROWS, so it is
          off unless asked for. The seeders converge, so one run is enough — the
          data persists and later deploys need not repeat it.
        type: boolean
        default: false

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build + deploy over SSH
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -euo pipefail
            cd "${{ secrets.VPS_PATH || '/opt/Smart-Digital-Khata' }}"
            git fetch --all
            git reset --hard origin/main
            chmod +x scripts/*.sh
            # Empty on a push, so the server's own .env decides as before; only a
            # deliberate dispatch with the box ticked can turn demo data on, and
            # only for that one run. scripts/deploy-data.sh treats an empty value
            # as "not set" and falls through to .env.
            export SEED_DEMO_DATA="${{ inputs.seed_demo == true && 'true' || '' }}"
            ./scripts/deploy.sh
