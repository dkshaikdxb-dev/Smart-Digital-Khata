name: Seed demo commerce

# Manual only. Seeds the DEMO shop (store01@demo.local) on the VPS with the
# 10 demo shops/customers (idempotent) and a 50-product kirana catalog +
# sample orders, then prints the consumer link in the run logs.
# Never touches real shops; the seeders are guarded to demo data only.
on:
  workflow_dispatch:

concurrency:
  group: seed-demo-${{ github.ref }}
  cancel-in-progress: false

jobs:
  seed:
    name: Seed demo shop (50 products) on the VPS
    runs-on: ubuntu-latest
    steps:
      - name: Seed over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 10m
          script: |
            set -euo pipefail
            cd "${{ secrets.VPS_PATH || '/opt/Smart-Digital-Khata' }}"
            # One entry point, not a hand-maintained list. This calls the SAME
            # loader a deploy uses when SEED_DEMO_DATA is set, so the two can
            # never drift: running the two seeders by name here quietly skipped
            # the house promos and the branded flagship storefront, and would
            # have skipped whatever is added next.
            #
            # FORCE_DEMO is the seeders' own production guard; setting it here is
            # this workflow saying the operator asked for demo data on purpose.
            # Everything it runs converges, so re-running changes nothing.
            docker compose exec -T -e FORCE_DEMO=true backend npm run data:demo
            # Say what the database now holds, the same as a deploy does.
            docker compose exec -T backend npm run data:status
