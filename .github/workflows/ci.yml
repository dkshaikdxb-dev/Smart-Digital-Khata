name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://user:pass@localhost:5432/db
      JWT_SECRET: test_secret_test_secret_test_secret_abc
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install
        working-directory: backend
        run: npm ci
      - name: Migrate
        working-directory: backend
        run: npm run migrate
      # Integration tests share one Postgres, so run serially to avoid cross-suite races.
      - name: Test
        working-directory: backend
        run: npm test -- --runInBand

  admin:
    name: Admin build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin-dashboard/package-lock.json
      - name: Install
        working-directory: admin-dashboard
        run: npm ci
      # The language gate decides whether a shopkeeper who picks Bengali,
      # Gujarati or Marathi actually gets it. It has no jest harness, so this
      # plain Node suite is the gate; it exits non-zero on a regression.
      - name: Language gate tests
        working-directory: admin-dashboard
        run: npm run test:i18n
      # The dashboard now has a jest suite. `next build` proves pages compile
      # and server-render; it runs no effect, so it cannot tell a failed load
      # from an empty one. These tests can, which is the whole point of them.
      - name: Dashboard tests
        working-directory: admin-dashboard
        run: npm test
      # Script integrity of the two mobile dictionaries. The coverage gate asks
      # whether a key is present and its placeholders match; this asks whether
      # the text is actually in the language it claims to be. With translations
      # arriving in bulk from outside the repo, a row-shifted paste puts Tamil in
      # the Telugu block and every other gate stays green.
      - name: Translation script integrity
        run: node scripts/i18n-script-check.mjs
      # The decision registry is only worth having if it is binding. This checks
      # that every LOCKED decision still describes what the dictionaries say,
      # that the Gujarati loanword spelling holds as a corpus invariant rather
      # than a token list, that protected brand terms keep their casing, and
      # that the 34 intentional and 83 undecided web/app divergences are still
      # exactly the sets somebody signed off — so a pair that converges or
      # appears has to be recorded before it can ship.
      - name: i18n decision registry
        run: node scripts/i18n-registry-check.mjs
      # And the gate itself is tested by breaking things. The first version of
      # it passed this repo cleanly while being blind to the owner dictionary
      # for every key the consumer one also had — a green run said nothing about
      # that. This copies the dictionaries aside, violates each rule in turn,
      # and fails if any violation is allowed through.
      - name: i18n registry gate — mutation tests
        run: node scripts/i18n-registry-check.test.mjs
      - name: Build
        working-directory: admin-dashboard
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
        run: npm run build

  mobile-i18n:
    name: Mobile translation coverage & logic tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      # The two native dictionaries fall back to English for any key a language
      # is missing, which is right at run time and invisible in review: a
      # language can quietly lose strings and only a shopkeeper finds out. This
      # ratchet holds each language to the count it had, and also fails on
      # orphan keys and on {placeholder} drift away from en. No dependencies, so
      # there is nothing to install.
      - name: Coverage ratchet
        run: node scripts/i18n-coverage.mjs
      # The native consumer app has no test runner and nothing is installed for
      # it here, so its PURE logic — variant grouping and catalogue filtering on
      # the storefront, the typed statement date range, and the over-the-air
      # update helpers — is exercised the same dependency-free way: read the
      # source, run it in a vm, assert. The React screens are not covered; only
      # the logic underneath them is.
      - name: Consumer app logic tests
        run: node scripts/mobile-consumer-logic.test.mjs
      # The owner app's More menu routes seven rows into the live web console.
      # The list used to carry a comment saying the paths were "confirmed
      # against admin-dashboard/src/pages" — confirmed once, by hand. A page
      # renamed on the web side would leave a row that opens a 404 inside a
      # WebView, and nothing would say so. This checks the relationship instead
      # of describing it.
      - name: Owner app logic tests
        run: node scripts/mobile-owner-logic.test.mjs

  docker:
    name: Docker build sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Stub env for compose
        run: cp .env.example .env
      - name: Build images
        run: docker compose -f docker-compose.yml build backend admin
