name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://user:pass@localhost:5432/db
      JWT_SECRET: test_secret_test_secret_test_secret_abc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install
        working-directory: backend
        run: npm ci
      - name: Migrate
        working-directory: backend
        run: npm run migrate
      # Integration tests share one Postgres, so run serially to avoid cross-suite races.
      - name: Test
        working-directory: backend
        run: npm test -- --runInBand

  admin:
    name: Admin build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin-dashboard/package-lock.json
      - name: Install
        working-directory: admin-dashboard
        run: npm ci
      - name: Build
        working-directory: admin-dashboard
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
        run: npm run build

  docker:
    name: Docker build sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stub env for compose
        run: cp .env.example .env
      - name: Build images
        run: docker compose -f docker-compose.yml build backend admin
