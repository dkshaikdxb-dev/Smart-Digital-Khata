name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install
        working-directory: backend
        run: npm ci
      - name: Test
        working-directory: backend
        env:
          JWT_SECRET: test_secret_test_secret_test_secret_abc
          DATABASE_URL: postgres://user:pass@localhost:5432/db
        run: npm test --silent

  admin:
    name: Admin build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin-dashboard/package-lock.json
      - name: Install
        working-directory: admin-dashboard
        run: npm ci
      - name: Build
        working-directory: admin-dashboard
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
        run: npm run build

  docker:
    name: Docker build sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stub env for compose
        run: cp .env.example .env
      - name: Build images
        run: docker compose -f docker-compose.yml build backend admin
