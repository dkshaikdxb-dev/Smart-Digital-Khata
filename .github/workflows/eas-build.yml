name: EAS Build (Android APK)

# On-demand installable APK builds for the two app flavors — Shop Owner and
# Consumer — using Expo Application Services. Play Store submission is NOT part of
# this workflow (no AAB, no `eas submit`) — it produces sideloadable APKs only.
#
# It runs on GitHub's runners and triggers the build on Expo's servers using an
# Expo access token stored as the repo secret EXPO_TOKEN (never in code). The
# build's page + the installable .apk artifact URL appear in this job's log.
#
# One-time setup (see mobile-app/EAS_BUILD.md):
#   1. Create an Expo access token at https://expo.dev/settings/access-tokens
#   2. Add it as an Actions secret named  EXPO_TOKEN
#   3. The owning Expo account is set in app.config.js (the `owner` field). Owner
#      and consumer are separate EAS projects (different slugs), so each has its
#      own project id. The first build of a flavor creates its project and prints
#      the id; add it as an Actions *variable* — EAS_PROJECT_ID_OWNER for owner,
#      EAS_PROJECT_ID_CONSUMER for consumer — so later builds link non-interactively.

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: Which app to build
        type: choice
        options: [consumer, owner]
        default: consumer

jobs:
  android-apk:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      APP_FLAVOR: ${{ inputs.flavor }}
      # Owner and consumer are separate EAS projects (different slugs), so each
      # has its own project id. Pick the right one for this flavor.
      EAS_PROJECT_ID: ${{ inputs.flavor == 'owner' && vars.EAS_PROJECT_ID_OWNER || vars.EAS_PROJECT_ID_CONSUMER }}
    steps:
      - name: Guard — token must be configured
        run: |
          if [ -z "${EXPO_TOKEN}" ]; then
            echo "::error::EXPO_TOKEN secret is not set. Create an Expo access token at https://expo.dev/settings/access-tokens and add it as an Actions secret named EXPO_TOKEN."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install eas-cli
        run: npm i -g eas-cli

      - name: Verify Expo auth
        run: eas whoami

      - name: Install app dependencies
        working-directory: mobile-app
        run: npm ci

      - name: Resolve or create the EAS project id
        working-directory: mobile-app
        run: |
          set -o pipefail
          VARNAME="EAS_PROJECT_ID_$(echo "${APP_FLAVOR}" | tr '[:lower:]' '[:upper:]')"
          if [ -n "${EAS_PROJECT_ID}" ]; then
            echo "Using ${VARNAME}=${EAS_PROJECT_ID}"
            exit 0
          fi
          echo "No ${VARNAME} variable set — creating/linking the '${APP_FLAVOR}' project on the account from app.config.js (owner field)."
          # 'eas init' creates or links the project for this flavor's owner+slug.
          # With a dynamic app config it cannot write the id back to the file, so
          # it prints the id — we capture it and hand it to the build step (and
          # tell the operator which Actions variable to save for next time).
          out=$(eas init --non-interactive --force 2>&1 | tee /dev/stderr) || true
          pid=$(printf '%s\n' "$out" | grep -oiE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | head -1)
          if [ -z "$pid" ]; then
            echo "::error::Could not determine the EAS project id from 'eas init'. See the log above; then create it once and add its id as the Actions variable ${VARNAME}."
            exit 1
          fi
          echo "EAS_PROJECT_ID=$pid" >> "$GITHUB_ENV"
          echo "::notice title=Save this::Project id for '${APP_FLAVOR}' is $pid. Add it as an Actions *variable* named ${VARNAME} to skip this step on future builds."

      - name: Build Android APK (${{ inputs.flavor }}-preview)
        working-directory: mobile-app
        run: |
          echo "Building the ${APP_FLAVOR} app (preview / APK). This runs on Expo's servers and can take 10-20 minutes."
          eas build --platform android --profile "${APP_FLAVOR}-preview" --non-interactive
          echo "Done. The installable .apk URL is printed above (also on https://expo.dev under this project's Builds)."
