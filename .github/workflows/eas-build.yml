name: EAS Build (Android APK)

# On-demand installable APK builds for the two app flavors — Shop Owner and
# Consumer — using Expo Application Services. Play Store submission is NOT part of
# this workflow (no AAB, no `eas submit`) — it produces sideloadable APKs only.
#
# It runs on GitHub's runners and triggers the build on Expo's servers using an
# Expo access token stored as the repo secret EXPO_TOKEN (never in code). The
# build's page + the installable .apk artifact URL appear in this job's log.
#
# One-time setup (see mobile-app/EAS_BUILD.md):
#   1. Create an Expo access token at https://expo.dev/settings/access-tokens
#   2. Add it as an Actions secret named  EXPO_TOKEN
#   3. Get the EAS project id once (run `eas init` locally, or let this workflow's
#      first run create it) and add it as an Actions *variable* named
#      EAS_PROJECT_ID so subsequent builds link non-interactively.

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: Which app to build
        type: choice
        options: [consumer, owner]
        default: consumer

jobs:
  android-apk:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      APP_FLAVOR: ${{ inputs.flavor }}
      EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
    steps:
      - name: Guard — token must be configured
        run: |
          if [ -z "${EXPO_TOKEN}" ]; then
            echo "::error::EXPO_TOKEN secret is not set. Create an Expo access token at https://expo.dev/settings/access-tokens and add it as an Actions secret named EXPO_TOKEN."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install eas-cli
        run: npm i -g eas-cli

      - name: Verify Expo auth
        run: eas whoami

      - name: Install app dependencies
        working-directory: mobile-app
        run: npm ci

      - name: Ensure the EAS project is linked
        working-directory: mobile-app
        run: |
          if [ -z "${EAS_PROJECT_ID}" ]; then
            echo "No EAS_PROJECT_ID variable set — attempting first-time project creation via 'eas init'."
            echo "After this run, copy the project id it prints and add it as an Actions variable EAS_PROJECT_ID."
            eas init --non-interactive || true
          else
            echo "Using EAS_PROJECT_ID=${EAS_PROJECT_ID}"
          fi

      - name: Build Android APK (${{ inputs.flavor }}-preview)
        working-directory: mobile-app
        run: |
          echo "Building the ${APP_FLAVOR} app (preview / APK). This runs on Expo's servers and can take 10-20 minutes."
          eas build --platform android --profile "${APP_FLAVOR}-preview" --non-interactive
          echo "Done. The installable .apk URL is printed above (also on https://expo.dev under this project's Builds)."
