name: Backend CI

on:
  push:
    paths:
      - 'backend/api/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          cd backend/api
          npm install

      - name: Run Build Check
        run: |
          cd backend/api
          npm run start
