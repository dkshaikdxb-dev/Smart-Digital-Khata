# ============================================================================
# Development overlay — run via ./scripts/dev.sh (never by hand in prod).
#
#   docker compose -p smart-digital-khata-dev \
#     -f docker-compose.yml -f docker-compose.dev.yml up
#
# The separate project name (-p smart-digital-khata-dev) gives development
# its own containers, network, and volumes — fully isolated from a
# production stack on the same machine.
#
# Ports use DEV_-prefixed variables with offset defaults (8080/8443,
# 14000, 13000, 15432, 16379), so the production port settings in .env
# (HTTP_PORT, BACKEND_HOST_PORT, …) never leak into the dev stack and
# both stacks always run side by side without collisions.
# ============================================================================

services:
  postgres:
    ports: !override
      - "127.0.0.1:${DEV_POSTGRES_HOST_PORT:-15432}:5432"

  redis:
    ports: !override
      - "127.0.0.1:${DEV_REDIS_HOST_PORT:-16379}:6379"

  backend:
    build:
      target: dev           # full deps incl. nodemon (see backend/Dockerfile)
    image: smart-digital-khata-backend-dev
    pull_policy: build      # local-only image — never try to pull it from a registry
    command: ["npx", "nodemon", "src/server.js"]
    working_dir: /app
    environment:
      NODE_ENV: development
      PORT: 4000
    volumes:
      # Hot reload: source is bind-mounted; node_modules stays in the image
      - ./backend/src:/app/src:ro
      - ./backend/migrations:/app/migrations:ro
      - ./backend/package.json:/app/package.json:ro
    ports: !override
      - "127.0.0.1:${DEV_BACKEND_HOST_PORT:-14000}:4000"

  admin:
    build:
      args:
        NEXT_PUBLIC_API_URL: ${DEV_NEXT_PUBLIC_API_URL:-http://localhost:14000}
    image: smart-digital-khata-admin-dev
    pull_policy: build
    environment:
      NEXT_PUBLIC_API_URL: ${DEV_NEXT_PUBLIC_API_URL:-http://localhost:14000}
    ports: !override
      - "127.0.0.1:${DEV_ADMIN_HOST_PORT:-13000}:3000"

  nginx:
    ports: !override
      - "${DEV_HTTP_PORT:-8080}:80"
      - "${DEV_HTTPS_PORT:-8443}:443"
