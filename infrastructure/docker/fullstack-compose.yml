version: '3.9'

services:
  frontend:
    build:
      context: ../../apps/web
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000/api
    depends_on:
      - backend

  backend:
    build:
      context: ../../backend/api
    ports:
      - '5000:5000'
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/smart_khata
      JWT_SECRET: super_secret_key
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smart_khata
    ports:
      - '5432:5432'

