<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline — Smart Digital Khata</title>
<style>
  body { margin:0; min-height:100vh; display:grid; place-items:center;
    background:#0f172a; color:#e2e8f0; font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
  .card { text-align:center; padding:32px; max-width:340px; }
  .dot { font-size:44px; }
  h1 { font-size:20px; margin:12px 0 6px; }
  p { color:#94a3b8; line-height:1.5; }
  button { margin-top:18px; background:#22c55e; color:#000; border:0; padding:12px 20px;
    border-radius:10px; font-weight:700; cursor:pointer; }
</style>
</head>
<body>
  <div class="card">
    <div class="dot">📴</div>
    <h1>You're offline</h1>
    <p>Smart Digital Khata needs a connection to load your ledger. Check your internet and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
