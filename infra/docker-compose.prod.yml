version: '3.9'

services:
  web:
    build: ../frontend/web
    ports:
      - '3000:3000'

  api:
    build: ../backend/api
    ports:
      - '5000:5000'

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: smart_digital_khata
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

  redis:
    image: redis:7
